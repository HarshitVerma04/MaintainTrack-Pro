# Server
server.port=8080

#  Database ?
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

#  JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#  App
spring.application.name=maintaintrack-api

#  JWT
jwt.secret=${JWT_SECRET:MaintainTrackSuperSecretKeyForJWTSigning2026MustBe256BitsLong!!}
jwt.expiry-ms=${JWT_EXPIRY_MS:28800000}

#  Actuator, health only, no details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024


# Springdoc / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.config-url=/api-docs/swagger-config
springdoc.swagger-ui.url=/api-docs
spring.mvc.pathmatch.use-suffix-pattern=false
